# docker-compose.yml
version: '3.8'

services:
  # --- 1. Flask Backend Service ---
  backend:
    build:
      context: . # Build from the current directory (where Dockerfile and app.py are)
      dockerfile: Dockerfile
    container_name: xdownloader_backend
    environment:
      # Flask runs on 0.0.0.0:5000 inside the container
      - FLASK_ENV=production
    volumes:
      # Map the temp folder for file storage (optional, but good for debugging)
      - /tmp/xdownloader_files:/tmp/xdownloader_files
    restart: always

  # --- 2. Nginx Frontend Service ---
  frontend:
    image: nginx:stable-alpine
    container_name: xdownloader_frontend
    volumes:
      # Map your frontend HTML/CSS/JS files to the Nginx public directory
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      # Map host port 80 to container port 80 (Access via http://localhost:80)
      - "80:80" 
    depends_on:
      - backend
    restart: always

networks:
  default:
    driver: bridge